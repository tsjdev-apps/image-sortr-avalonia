name: Release ImageSortr

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  metadata:
    name: Extract Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>, for example v1.2.3." >&2
            exit 1
          fi

          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ImageSortr.slnx

      - name: Build
        run: dotnet build ImageSortr.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ImageSortr.slnx --configuration Release --no-build --no-restore --verbosity normal

  package:
    name: Package ${{ matrix.rid }}
    needs:
      - metadata
      - validate
    runs-on: ${{ matrix.runner_os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_os: windows-latest
            rid: win-x64
            archive_extension: zip
            archive_type: zip
          - runner_os: ubuntu-latest
            rid: linux-x64
            archive_extension: tar.gz
            archive_type: tar.gz
          - runner_os: macos-latest
            rid: osx-x64
            archive_extension: tar.gz
            archive_type: tar.gz
          - runner_os: macos-latest
            rid: osx-arm64
            archive_extension: tar.gz
            archive_type: tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ImageSortr.slnx --runtime ${{ matrix.rid }}

      - name: Publish application
        run: >-
          dotnet publish src/ImageSortr.App/ImageSortr.App.csproj
          --configuration Release
          --no-restore
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./publish
          /p:Version=${{ needs.metadata.outputs.version }}

      - name: Remove symbol and documentation files from publish output
        shell: pwsh
        run: |
          Get-ChildItem -Path ./publish -Filter *.xml -File | Remove-Item -Force
          Get-ChildItem -Path ./publish -Filter *.pdb -File | Remove-Item -Force

      - name: Package publish output (zip)
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path .\publish\* -DestinationPath ".\release\ImageSortr-${{ needs.metadata.outputs.tag_name }}-${{ matrix.rid }}.${{ matrix.archive_extension }}" -Force

      - name: Package publish output (tar.gz)
        if: matrix.archive_type == 'tar.gz'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "./release/ImageSortr-${{ needs.metadata.outputs.tag_name }}-${{ matrix.rid }}.${{ matrix.archive_extension }}" -C ./publish .

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: ./release/ImageSortr-${{ needs.metadata.outputs.tag_name }}-${{ matrix.rid }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p ./release
          find ./artifacts -maxdepth 2 -type f -exec mv {} ./release/ \;
          ls -la ./release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ImageSortr ${{ needs.metadata.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
